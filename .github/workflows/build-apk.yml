name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
          cache: true

      - name: تثبيت مكتبات بايثون
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.0 websockets

      - name: إنشاء مشروع فلاتر وخلق هيكل البناء
        run: |
          # إنشاء مشروع فلاتر فارغ بالاسم المطلوبة لتفادي أي نقص في الملفات
          flutter create . --org com.lgremote --project-name lg_remote_app --platforms=android

      - name: دمج ملف بايثون الرئيسي
        run: |
          # التأكد من أن ملف main.py في مكانه الصحيح ضمن مسار البناء
          mkdir -p src
          if [ -f main.py ]; then
            cp main.py src/main.py
          fi

      - name: بناء ملف APK للأندرويد
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true
          flutter build apk --release

      - name: رفع ملف الـ APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
