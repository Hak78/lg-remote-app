name: Build Flet Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
          cache: true

      - name: تثبيت أدوات Flet ومكتبات البناء
        run: |
          python -m pip install --upgrade pip
          pip install flet[cli] flet==0.24.0 websockets

      - name: قبول رخص أندرويد
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: بناء تطبيق Flet كملف APK
        run: |
          flet build apk --project-name lg_remote_app --org com.lgremote --description "LG Smart Remote App"

      - name: رفع ملف الـ APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/apk/*.apk
            dist/*.apk
