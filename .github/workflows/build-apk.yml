name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت مكتبات المشروع
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Flutter (المطلوبة لـ Flet)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: بناء تطبيق الـ APK
        run: yes | flet build apk

      - name: رفع ملف الـ APK النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: build/apk/**/*.apk
