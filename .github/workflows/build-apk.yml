name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
          cache: true

      - name: تحديث وتثبيت أدوات Flet ومكتبات المشروع
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flet serious-python
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: تثبيت مكتبات النظام اللازمة
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev

      - name: تغليف تطبيق بايثون وبناء الـ APK مباشرة
        env:
          CI: "true"
        run: |
          flutter config --no-analytics
          
          # إنشاء قالب فلاتر الخاص بـ Flet إذا لم يكن موجوداً، أو استخدام الحزمة مباشرة
          flet create . --template=app || true
          
          # تغليف ملفات بايثون باستخدام serious_python
          python -m serious_python.main package . --mobile --platform mobile --dep-mappings flet=flet-embed --req-deps flet-embed --exclude build
          
          # بناء ملف الـ APK مباشرة عبر فلاتر
          flutter build apk --release --no-pub

      - name: رفع ملف الـ APK النهائي للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/apk/**/*.apk
