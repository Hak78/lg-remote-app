name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تثبيت Flet ومكتبات المشروع
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: بناء تطبيق الأندرويد باستخدام أداة Flet
        run: |
          # استخدام الأمر المباشر لبناء APK الخاص بـ Flet
          flet build apk --verbose

      - name: رفع ملف الـ APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
