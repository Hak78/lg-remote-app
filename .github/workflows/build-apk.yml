name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: إعداد بيئة جافا (للأندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.x'
          cache: true

      - name: تثبيت أدوات Flet ومكتبات المشروع
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: بناء تطبيق الأندرويد APK
        env:
          CI: "true"
        run: |
          flutter config --no-analytics
          flet build apk --verbose

      - name: رفع ملف الـ APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/apk/**/*.apk
