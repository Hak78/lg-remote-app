name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت أدوات Flet
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: بناء تطبيق الأندرويد APK باستخدام إجراء Flet الرسمي
        uses: flet-dev/build-app-action@main
        with:
          platform: 'apk'
          target: 'main.py' # تأكد من أن هذا يطابق اسم ملف التشغيل الرئيسي لديك (مثل main.py أو app.py)

      - name: رفع ملف الـ APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-App-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            dist/*.apk
